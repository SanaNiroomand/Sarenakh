{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
{{- $name := include "sarenakh.fullname" . }}
{{- $session := .Values.secret.sessionSecret }}
{{- if not $session }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data (hasKey $existing.data "SESSION_SECRET") }}
{{- $session = index $existing.data "SESSION_SECRET" | b64dec }}
{{- else }}
{{- $session = randAlphaNum 48 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "sarenakh.labels" . | nindent 4 }}
type: Opaque
stringData:
  OPENAI_API_KEY: {{ .Values.secret.openaiApiKey | quote }}
  SESSION_SECRET: {{ $session | quote }}
{{- end }}
