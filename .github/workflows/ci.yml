name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: backend tests
        working-directory: backend
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: frontend typecheck + build
        run: |
          npm --prefix frontend ci --no-audit --no-fund
          npm --prefix frontend run typecheck
          npm --prefix frontend run build

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: helm lint deploy/helm/sarenakh --strict
      - name: render (defaults, ingress+TLS+existing secret, guard against >1 replica)
        run: |
          helm template t deploy/helm/sarenakh > /tmp/default.yaml
          helm template t deploy/helm/sarenakh \
            --set ingress.enabled=true \
            --set 'ingress.tls[0].secretName=sarenakh-tls' \
            --set 'ingress.tls[0].hosts[0]=sarenakh.example.com' \
            --set secret.existingSecret=sarenakh-secrets > /tmp/ingress.yaml
          grep -q 'COOKIE_SECURE: "true"' /tmp/ingress.yaml
          if helm template t deploy/helm/sarenakh --set replicaCount=2 >/dev/null 2>&1; then
            echo "replicaCount=2 must fail"; exit 1
          fi
      - name: kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary /tmp/default.yaml /tmp/ingress.yaml

  image:
    needs: [test, chart]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      owner: ${{ steps.vars.outputs.owner }}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "app_version=$(sed -n 's/^appVersion: *"\(.*\)"/\1/p' deploy/helm/sarenakh/Chart.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.vars.outputs.owner }}/sarenakh
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.vars.outputs.app_version }},enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=sarenakh
            org.opencontainers.image.description=Sarenakh — AI agent that finds potential customers in Persian Telegram chats
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart-publish:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: package and push the chart to ghcr.io (OCI)
        env:
          OWNER: ${{ needs.image.outputs.owner }}
        run: |
          sed -i "s#OWNER#${OWNER}#g" deploy/helm/sarenakh/Chart.yaml deploy/helm/sarenakh/values.yaml
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package deploy/helm/sarenakh -d /tmp/chart
          helm push /tmp/chart/sarenakh-*.tgz "oci://ghcr.io/${OWNER}/charts"
